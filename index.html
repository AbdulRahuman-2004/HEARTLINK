<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HeartLink | Messages from the Heart</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <div class="logo">💜 HeartLink</div>
      <p>Little words. Big feelings.</p>
      <h1>Make someone feel special ✨</h1>
      <p>Create a heartfelt message for someone you care about.</p>
    </header>

    <section class="message-form">
      <label for="sender">Your name</label>
      <input id="sender" type="text" placeholder="Enter your name">

      <label for="recipient">Their name</label>
      <input id="recipient" type="text" placeholder="Who is this message for?">

      <label for="relation">Your relationship</label>
      <select id="relation">
        <option value="lover">Lover</option>
        <option value="bestie">Best friend / Bestie</option>
        <option value="friend">Friend</option>
        <option value="brother">Brother</option>
        <option value="sister">Sister</option>
        <option value="family">Family member</option>
      </select>

      <label for="occasion">Occasion</label>
      <select id="occasion">
        <option value="love">Just because I care</option>
        <option value="birthday">Birthday</option>
        <option value="anniversary">Anniversary</option>
        <option value="friendship">Friendship</option>
        <option value="sorry">Say sorry</option>
        <option value="miss">I miss you</option>
      </select>

      <label for="language">Message language</label>
      <select id="language">
        <option value="english">English</option>
        <option value="tamil">தமிழ் (Tamil)</option>
        <option value="tanglish">Tanglish</option>
      </select>

      <label for="tone">Message style</label>
      <select id="tone">
        <option value="sweet">Sweet and simple</option>
        <option value="emotional">Emotional</option>
        <option value="funny">Funny and playful</option>
      </select>

      <button id="generateBtn" type="button">
        💌 Generate Message
      </button>

      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <section class="result">
      <h2>Your HeartLink Message 💖</h2>
      <div id="output">Your personalized message will appear here.</div>

      <div class="actions">
        <button id="anotherBtn" type="button">🔄 Another Message</button>
        <button id="copyBtn" type="button">📋 Copy Message</button>
        <button id="shareBtn" type="button">💬 Share on WhatsApp</button>
      </div>
    </section>

    <footer>
      Made with 💜 by HeartLink
    </footer>
  </main>
</body>
</html>
